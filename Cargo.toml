[package]
edition      = "2024"
name         = "esp32_phyllotaxis"
rust-version = "1.93"
version      = "0.1.0"

[[bin]]
name = "esp32_phyllotaxis"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["defmt", "esp32s3", "unstable"] }

esp-rtos = { version = "0.3.0", features = ["defmt", "embassy", "esp32s3", "esp-radio", "esp-alloc"] }

defmt                  = "1.0.1"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["defmt", "esp32s3"] }

embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time     = { version = "0.5.0", features = ["defmt"] }
embassy-sync     = { version = "0.7.2", features = ["defmt"] }
esp-println      = { version = "0.17.0", features = ["defmt-espflash", "esp32s3"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"

# --- ported DSP core (pure no_std, hardware-agnostic) ---
microfft = "0.6"
libm     = "0.2"

# --- wifi + http (phase 0 of member-uploaded sketches) ---
esp-radio = { version = "0.18.0", features = ["esp32s3", "wifi", "defmt", "esp-alloc"] }
esp-alloc = "0.10.0"
embassy-net = { version = "0.9.1", features = ["defmt", "dhcpv4", "dns", "medium-ethernet", "multicast", "proto-ipv4", "tcp", "udp"] }
picoserve = { version = "0.19", features = ["embassy", "defmt", "alloc"] }

# --- wasm sketch gallery (phase 2) ---
wasmi = { version = "1.1.0", default-features = false }
esp-storage = { version = "0.9.0", features = ["esp32s3"] }
embedded-storage = "0.3"

# --- needed for the port (see PORTING.md); versions TBD against esp-hal 1.1 ---
# esp-hal-smartled is UNUSABLE on esp-hal 1.1: latest (0.17.0) and even git still
# pin esp-hal "~1.0", and esp-rtos 0.3 / esp-bootloader 0.5 require esp-hal "~1.1",
# so the versions can't coexist. Driving WS2812 via esp-hal's `rmt` directly instead
# (PORTING.md fallback) -- which also makes smart-leds unnecessary.
# embassy-sync     = { version = "...", features = ["defmt"] }    # match the embassy-executor 0.10 ecosystem
# bytemuck         = { version = "1", default-features = false }  # I2S byte<->u16 cast


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"
# The esp rustc's incremental codegen assembles global_asm! without the esp32s3
# CPU features, rejecting loop-option registers (LBEG) in vendor/xtensa-lx-rt.
incremental = false

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'

[patch.crates-io]
xtensa-lx-rt = { path = "vendor/xtensa-lx-rt" }
esp-rtos     = { path = "vendor/esp-rtos" }
