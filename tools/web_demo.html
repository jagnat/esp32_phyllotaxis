<!doctype html>
<meta charset="utf-8">
<title>phyllotaxis streamer</title>
<style>
  body { background:#111; color:#ddd; font:14px monospace; display:flex; flex-direction:column;
         align-items:center; gap:12px; padding:20px; }
  canvas { background:#000; border-radius:50%; }
  input { width:200px; }
  #status { min-height:1.2em; }
</style>
<div>
  <input id="host" placeholder="board ip or host">
  <button id="go">connect</button>
</div>
<canvas id="c" width="480" height="480"></canvas>
<div id="status">disconnected</div>
<script>
const POS = [[-0.604943, 0.716713], [-0.367912, 0.828846], [-0.403206, 0.670747], [-0.406162, 0.518173], [-0.378815, 0.3766], [-0.243444, 0.440284], [-0.233546, 0.582236], [-0.191784, 0.726671], [-0.117368, 0.867876], [-0.010927, 0.99994], [0.260639, 0.933231], [0.125276, 0.835379], [0.018225, 0.720266], [-0.058476, 0.593399], [-0.103822, 0.460491], [0.104013, 0.555565], [0.209383, 0.656877], [0.340766, 0.73887], [0.494697, 0.796812], [0.674589, 0.606032], [0.51332, 0.590744], [0.367301, 0.546407], [0.241108, 0.47665], [0.343507, 0.367585], [0.481569, 0.402036], [0.631841, 0.406951], [0.78913, 0.379813], [0.947623, 0.31939], [0.968097, 0.040501], [0.833205, 0.139002], [0.690646, 0.205241], [0.546286, 0.238984], [0.40587, 0.24104], [0.560515, 0.072756], [0.68943, 0.003852], [0.808009, -0.095764], [0.910683, -0.224257], [0.78483, -0.454298], [0.720456, -0.305647], [0.633166, -0.180475], [0.527828, -0.082014], [0.455743, -0.213104], [0.531172, -0.333764], [0.582283, -0.475162], [0.605078, -0.633139], [0.59659, -0.802546], [0.337678, -0.9082], [0.389674, -0.749471], [0.408617, -0.59342], [0.396099, -0.445699], [0.354663, -0.31152], [0.242404, -0.510599], [0.216709, -0.654497], [0.158611, -0.798055], [0.068136, -0.93541], [-0.189537, -0.886804], [-0.068054, -0.779644], [0.024017, -0.657947], [0.085108, -0.527338], [-0.061842, -0.49929], [-0.153287, -0.608313], [-0.27197, -0.700617], [-0.415172, -0.771114], [-0.57891, -0.815391], [-0.759401, -0.6018], [-0.592374, -0.602201], [-0.438107, -0.571995], [-0.301483, -0.514441], [-0.186676, -0.43357], [-0.410701, -0.388324], [-0.555497, -0.408353], [-0.709982, -0.397461], [-0.868573, -0.353859], [-0.90197, -0.093777], [-0.762516, -0.1762], [-0.618323, -0.226159], [-0.475228, -0.243899], [-0.493963, -0.095474], [-0.625909, -0.042194], [-0.75037, 0.042157], [-0.861668, 0.156564], [-0.954376, 0.298607], [-0.807013, 0.536267], [-0.755781, 0.377291], [-0.679382, 0.239908], [-0.582426, 0.127757], [-0.470036, 0.043559], [-0.496231, 0.270601], [-0.560025, 0.402121], [-0.597405, 0.552411]];
const N = POS.length;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const status = document.getElementById('status');
let ws = null, enc = 0, btn = 0, bands = new Float32Array(6);
let telemetryCount = 0, lastTelemetryCount = 0, sentCount = 0;

setInterval(() => {
  if (!ws || ws.readyState !== 1) return;
  const rate = telemetryCount - lastTelemetryCount;
  lastTelemetryCount = telemetryCount;
  status.textContent = rate > 0
    ? `streaming (${rate} telemetry/s, encoder=${enc}, btn=${btn})`
    : `connected but NO telemetry - another streamer owns the session, or board unreachable`;
}, 1000);

document.getElementById('go').onclick = () => {
  if (ws) ws.close();
  ws = new WebSocket(`ws://${document.getElementById('host').value}/stream`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => status.textContent = 'streaming';
  ws.onclose = () => status.textContent = 'disconnected';
  ws.onerror = () => status.textContent = 'error';
  ws.onmessage = (ev) => {
    const d = new DataView(ev.data);
    if (d.getUint32(0, true) !== 0x31594850) return; // "PHY1"
    telemetryCount++;
    enc = d.getInt32(8, true);
    btn = d.getUint8(12);
    // Mic bands are noise-floor normalized and jumpy; smooth them for display use.
    for (let i = 0; i < 6; i++)
      bands[i] = 0.85 * bands[i] + 0.15 * d.getFloat32(16 + 4 * i, true);
  };
};

function hsv(h, s, v) {
  const i = Math.floor(h * 6), f = h * 6 - i;
  const p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  return [[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i % 6].map(x => x * 255 | 0);
}

const frame = new Uint8Array(N * 3);
// The board gamma-corrects incoming frames; apply the same curve to the
// preview so canvas and LEDs match.
const gamma = (c) => Math.pow(c / 255, 2.3) * 255 | 0;
let lastSend = 0;
function tick(ms) {
  const t = ms / 1000;
  const bass = Math.min(1, bands[0] + bands[1]);
  for (let i = 0; i < N; i++) {
    const [x, y] = POS[i];
    const r = Math.hypot(x, y), th = Math.atan2(y, x);
    const h = ((th / (2 * Math.PI)) + t * 0.05 + enc * 0.02 + 1) % 1;
    const wave = 0.5 + 0.5 * Math.sin(r * 9 - t * 3);
    const v = btn ? 1 : 0.25 + 0.75 * wave * (0.4 + 0.6 * bass);
    const [R, G, B] = hsv(h, 1, v);
    frame[3*i] = R; frame[3*i+1] = G; frame[3*i+2] = B;
  }
  if (ws && ws.readyState === 1 && ms - lastSend >= 1000 / 60 && ws.bufferedAmount < 2048) {
    ws.send(frame);
    lastSend = ms;
    sentCount++;
  }

  ctx.clearRect(0, 0, 480, 480);
  for (let i = 0; i < N; i++) {
    const [x, y] = POS[i];
    ctx.fillStyle = `rgb(${gamma(frame[3*i])},${gamma(frame[3*i+1])},${gamma(frame[3*i+2])})`;
    ctx.beginPath();
    ctx.arc(240 + x * 220, 240 - y * 220, 7, 0, 7);
    ctx.fill();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
